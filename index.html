<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">

    <title>Future AI Zone | Rohith</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00f2fe; --dark: #000; --accent: #ff0050; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #f4f4f4; }
        header { background: #000; padding: 15px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid var(--primary); position: sticky; top: 0; }
        header img { height: 50px; width: 50px; border-radius: 50%; border: 2px solid var(--primary); margin-right: 15px; }

        .trending { background: white; padding: 10px; display: flex; align-items: center; border-bottom: 1px solid #ddd; font-size: 13px; }
        .t-label { background: var(--accent); color: white; padding: 2px 8px; border-radius: 3px; font-weight: bold; margin-right: 10px; }
        .container { max-width: 800px; margin: 20px auto; padding: 15px; }
        .post-card { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .post-img { width: 100%; height: 200px; background: #222; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: bold; }
        footer { text-align: center; padding: 30px; background: #fff; margin-top: 20px; }
        .social-links a { font-size: 24px; margin: 0 15px; text-decoration: none; }
    </style>
</head>

    <header>
