<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future AI Zone | Rohith</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --primary: #00f2fe; --dark: #080808; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background-color: var(--dark); color: white; }
        
        /* Lock Screen Overlay */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); z-index: 9999;
            display: flex; justify-content: center; align-items: center; text-align: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            max-width: 90%;
        }

        .btn {
            display: inline-block; padding: 15px 30px; border-radius: 50px;
            text-decoration: none; font-weight: bold; margin: 15px; cursor: pointer; transition: 0.3s;
        }
        .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
        .btn-unlock { background: var(--primary); color: #000; border: none; box-shadow: 0 0 20px var(--primary); }
        
        .hidden { display: none !important; }
        
        #main-content { padding: 50px 20px; text-align: center; }
        .blog-post { background: #121212; padding: 20px; border-radius: 15px; margin: 20px auto; max-width: 800px; border-left: 5px solid var(--primary); text-align: left; }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="lock-screen">
        <div class="glass-card" data-aos="zoom-in">
            <i class="fab fa-instagram" style="font-size: 4rem; color: #cc2366; margin-bottom: 20px;"></i>
            <h2>Follow to Unlock</h2>
            <p>ವೆಬ್‌ಸೈಟ್ ನೋಡಲು ಮೊದಲು ಇನ್ಸ್ಟಾಗ್ರಾಮ್ ಫಾಲೋ ಮಾಡಿ</p>
            
            <!-- Step 1: Follow Button -->
            <a href="https://www.instagram.com/future_ai_zone_by_rohith?igsh=Y2dmcGI4M3diOWlj" 
               target="_blank" class="btn btn-insta" id="follow-btn" onclick="enableUnlock()">
               <i class="fab fa-instagram"></i> Follow @Future_AI_Zone
            </a>

            <br>

            <!-- Step 2: Unlock Button (Visible only after clicking Follow) -->
            <button id="unlock-btn" class="btn btn-unlock hidden" onclick="unlockSite()">
               Unlock Website <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Main Website Content -->
    <div id="main-content" class="hidden">
        <h1 data-aos="fade-down">Future AI Zone</h1>
        <p>Welcome to the premium world of Rohith!</p>

        <div class="blog-post" data-aos="fade-up">
            <h3>ನನ್ನ ಮೊದಲ ಬ್ಲಾಗ್</h3>
            <p>ಇದು ನಾನು ಕ್ರಿಯೇಟ್ ಮಾಡಿದ ಮೊದಲ ಪ್ರೀಮಿಯಂ ವೆಬ್‌ಸೈಟ್. ಇಲ್ಲಿ ನೀವು ನನ್ನ ಎಲ್ಲಾ ಅಪ್ಡೇಟ್ಸ್ ಪಡೆಯಬಹುದು.</p>
        </div>

        <!-- Social & Contact Info -->
        <div style="margin-top: 50px;">
            <h3>Contact: 8431263321</h3>
            <div style="font-size: 2rem;">
                <a href="https://t.me/Future_zone_by_Rohith" style="color:white; margin:10px;"><i class="fab fa-telegram"></i></a>
                <a href="https://youtube.com/@FutureAIZoneByRohith" style="color:white; margin:10px;"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        function enableUnlock() {
            // ಇನ್ಸ್ಟಾಗ್ರಾಮ್ ಲಿಂಕ್ ಕ್ಲಿಕ್ ಮಾಡಿದ ಕೂಡಲೇ Unlock ಬಟನ್ ತೋರಿಸುತ್ತದೆ
            document.getElementById('unlock-btn').classList.remove('hidden');
        }

        function unlockSite() {
            // ಹಳೆ ಸ್ಕ್ರೀನ್ ತೆಗೆದು ಮೇನ್ ಕಂಟೆಂಟ್ ತೋರಿಸುತ್ತದೆ
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-content').classList.remove('hidden');
        }
    </script>
</body>
                                                                                                                                  </html>
